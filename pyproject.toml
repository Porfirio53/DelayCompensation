[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mytirex"
version = "0.1.0"
description = "TiRex-2 generic signal forecasting, clock-aware compensation and streaming"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.2.6", "pandas==2.3.3", "matplotlib==3.10.7",
  "torch==2.8.0", "flashrnn==1.0.8", "xlstm==2.0.3",
  "mlstm-kernels==2.0.6", "einops==0.8.1", "ninja==1.13.2",
  "PyYAML==6.0.3", "huggingface-hub==0.36.0", "narwhals==2.9.0",
  "dacite==1.9.2", "opt-einsum==3.4.0",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
mytirex = "mytirex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mytirex*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

